<!DOCTYPE html>
<html lang="it" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Benvenuti | Gianluca & Cristina</title>

    <!-- Collegamento al tuo file locale compilato (mantiene gli stessi stili) -->
    <link href="./output.css" rel="stylesheet">

    <!-- Google Fonts Premium -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Great+Vibes&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        html { -webkit-text-size-adjust: 100%; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 16px; }
        .font-serif { font-family: 'Cormorant Garamond', serif; }

        /* Nomi degli sposi: stesso stile della pagina principale */
        .nomi-sposi {
            font-family: 'Great Vibes', 'Snell Roundhand', cursive;
            font-weight: 400;
            font-size: clamp(2.6rem, 13vw, 4.2rem);
            line-height: 1;
            color: #00bfff;
            -webkit-text-stroke: 1.5px #313cda;
            paint-order: stroke fill;
            text-shadow: 2px 2px 4px rgba(0, 51, 170, 0.4);
        }
        .nomi-sposi .e-commerciale {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-weight: 500;
            color: #f59e0b;
            -webkit-text-stroke: 0;
            text-shadow: none;
        }
        .etichetta { font-size: .8rem; }

        /* Selettore di lingua, fisso in alto a destra */
        .lang-switch {
            position: fixed;
            top: calc(env(safe-area-inset-top, 0px) + 14px);
            right: 14px;
            z-index: 50;
            display: flex;
            gap: 6px;
            background: rgba(0, 0, 0, .35);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, .25);
            border-radius: 999px;
            padding: 4px;
        }
        .lang-switch button {
            font-size: .7rem;
            font-weight: 700;
            letter-spacing: .05em;
            color: rgba(255, 255, 255, .75);
            background: transparent;
            border: none;
            border-radius: 999px;
            padding: 5px 12px;
            cursor: pointer;
            transition: all .2s ease;
        }
        .lang-switch button.is-active {
            color: #1e293b;
            background: #ffffff;
        }
    </style>
</head>
<body class="bg-[#faf9f6] text-stone-800 antialiased">

    <!-- Selettore di lingua: valido anche nella pagina principale, la scelta resta memorizzata -->
    <div class="lang-switch" aria-label="Cambia lingua / Schimbă limba">
        <button type="button" data-lang="it" onclick="setSiteLang('it')">IT</button>
        <button type="button" data-lang="ro" onclick="setSiteLang('ro')">RO</button>
    </div>

    <!-- LANDING PAGE CONTAINER -->
    <header class="min-h-screen w-full flex flex-col items-center justify-center relative p-4 py-16 text-center bg-stone-900">

        <!-- Immagine di copertina identica con opacità originale -->
        <img src="./images/copertina.jpg" alt="Fedi Gianluca e Cristina" class="absolute inset-0 w-full h-full object-cover z-0 opacity-30">

        <!-- Overlay fluido protettivo -->
        <div class="absolute inset-0 bg-gradient-to-b from-black/20 via-black/10 to-[#faf9f6]/40 z-10"></div>

        <!-- CONTENUTO CENTRATO -->
        <div class="relative z-20 max-w-xl w-full mx-auto flex flex-col items-center space-y-6 px-2">

            <!-- Intestazione elegante -->
            <div class="space-y-2 w-full block">
                <span class="etichetta text-xs md:text-sm uppercase tracking-widest font-bold text-amber-400 block" data-ro="Nunta Noastră" style="letter-spacing: 0.3em;">Il Nostro Matrimonio</span>
                <h1 class="nomi-sposi">
                    Gianluca <span class="e-commerciale">&amp;</span> Cristina
                </h1>
            </div>

            <!-- CONTAINER DEL VIDEO: Ottimizzato per smartphone e PC -->
            <div class="w-full border border-white/20 bg-black/40 backdrop-blur-md p-2 rounded-2xl shadow-2xl transition-all duration-300">
                <div class="relative aspect-video w-full rounded-xl overflow-hidden bg-stone-950 shadow-inner">
                    <video controls playsinline preload="metadata" class="w-full h-full object-contain">
                        <source src="welcome-video.mp4" type="video/mp4">
                        <span data-ro="Browserul tău nu suportă eticheta video.">Il tuo browser non supporta il tag video.</span>
                    </video>
                </div>
            </div>

            <!-- Messaggio sotto il video -->
            <p class="font-serif italic text-lg md:text-xl text-white max-w-sm leading-relaxed drop-shadow-md" data-ro="Priviți mesajul nostru video înainte de a descoperi detaliile zilei celei mari">
                Guardate il nostro video messaggio prima di scoprire i dettagli del grande giorno
            </p>

            <!-- PULSANTE RAFFINATO PER ENTRARE NEL SITO -->
            <div class="pt-2 pb-4">
                <a href="matrimonio.html" class="inline-flex items-center space-x-3 border border-[#1e90ff]/40 bg-white/90 backdrop-blur-sm px-8 py-3.5 rounded-xl font-bold tracking-wider text-[#1e90ff] shadow-xl hover:bg-[#1e90ff] hover:text-white hover:border-[#1e90ff] transition-all duration-300 uppercase text-xs">
                    <span data-ro="Intră pe site">Entra nel Sito</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"></path>
                    </svg>
                </a>
            </div>

        </div>
    </header>

    <script src="./js/i18n.js"></script>
</body>
</html>
