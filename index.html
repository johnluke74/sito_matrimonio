    <!-- 3. SEZIONE RSVP (Modulo di Conferma) -->
    <section class="max-w-2xl mx-auto px-6 py-20 bg-white rounded-3xl shadow-sm border border-stone-100 my-12">
        <h2 class="font-serif text-3xl text-center font-bold mb-2 text-stone-900">Conferma la tua presenza</h2>
        <p class="text-center text-stone-500 mb-8 text-sm">Vi preghiamo di rispondere entro il 30 Giugno 2027</p>

        <!-- Il Form punta a un servizio di backend gratuito -->
        <form action="https://formsubmit.co" method="POST" class="space-y-6">
            
            <!-- Honeypot per evitare lo spam dei bot (invisibile agli utenti) -->
            <input type="text" name="_honey" style="display:none">
            <!-- Pagina di ringraziamento personalizzata dopo l'invio (opzionale) -->
            <input type="hidden" name="_next" value="https://github.io">

            <!-- Campo Nome e Cognome -->
            <div>
                <label class="block text-sm font-semibold text-stone-700 mb-2">Nome e Cognome</label>
                <input type="text" name="Nome Completo" required class="w-full px-4 py-3 bg-stone-50 border border-stone-200 rounded-xl focus:outline-hidden focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 transition-all">
            </div>

            <!-- Campo Presenza (Radio Buttons) -->
            <div>
                <label class="block text-sm font-semibold text-stone-700 mb-2">Ci sarai?</label>
                <div class="grid grid-cols-2 gap-4">
                    <label class="flex items-center justify-center p-3 bg-stone-50 border border-stone-200 rounded-xl cursor-pointer hover:border-amber-200 transition-all has-[:checked]:border-amber-500 has-[:checked]:bg-amber-50/30">
                        <input type="radio" name="Presenza" value="Sì, ci sarò!" required class="sr-only">
                        <span class="text-sm font-medium text-stone-800">🥳 Sì, ci sarò!</span>
                    </label>
                    <label class="flex items-center justify-center p-3 bg-stone-50 border border-stone-200 rounded-xl cursor-pointer hover:border-amber-200 transition-all has-[:checked]:border-amber-500 has-[:checked]:bg-amber-50/30">
                        <input type="radio" name="Presenza" value="No, purtroppo no" class="sr-only">
                        <span class="text-sm font-medium text-stone-600">😢 Non potrò</span>
                    </label>
                </div>
            </div>

            <!-- Campo Allergie o Menu Speciali -->
            <div>
                <label class="block text-sm font-semibold text-stone-700 mb-2">Note Alimentari (Allergie, Celiachia, Vegani...)</label>
                <textarea name="Note Alimentari" rows="2" placeholder="Es: Celiachia, menu vegetariano..." class="w-full px-4 py-3 bg-stone-50 border border-stone-200 rounded-xl focus:outline-hidden focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 transition-all"></textarea>
            </div>

            <!-- Pulsante di Invio -->
            <button type="submit" class="w-full py-4 bg-stone-900 text-white font-semibold rounded-xl shadow-md hover:bg-stone-800 active:scale-[0.99] transition-all cursor-pointer">
                Invia Conferma
            </button>
        </form>
    </section>
